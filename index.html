<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>スクワット出席（モック）</title>
  <meta name="description" content="スクワット出席アプリのフロントエンドモック" />
  <style>
    :root{
      --bg:#ffffff;
      --card:#fafafa;
      --line:#e6e6e6;
      --text:#111;
      --muted:#666;
      --shadow: 0 1px 2px rgba(0,0,0,.05);
      --r:16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .app{
      height:100vh;
      padding: 12px;
      padding-top: calc(12px + env(safe-area-inset-top));
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:hidden;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 12px;
      overflow:hidden;
    }
    .row{ display:flex; gap:10px; align-items:center; }
    .grow{ flex:1; }
    h1{ margin:0; font-size:14px; letter-spacing:.2px; }
    .muted{ color:var(--muted); font-size:12px; }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      font-size:12px;
      white-space:nowrap;
    }

    select{
      width:100%;
      padding:10px 12px;
      border-radius: 14px;
      border:1px solid var(--line);
      background:#fff;
      font-size:16px;
      outline:none;
    }

    button{
      border:0;
      border-radius: 16px;
      padding: 14px 12px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{ transform: scale(.99); }

    .btnPrimary{ background:#111; color:#fff; }
    .btnGhost{
      background:#fff; color:#111;
      border:1px solid var(--line);
      font-size:14px; font-weight:600;
      padding: 10px 12px;
    }

    .main{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .calendarWrap{
      background:#fff;
      border:1px solid var(--line);
      border-radius: var(--r);
      padding:10px;
    }
    .calendar{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:6px;
      user-select:none;
    }
    .dow{
      font-size:11px;
      color:var(--muted);
      text-align:center;
      padding: 2px 0;
    }
    .day{
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      background:#fff;
      color:#bbb; /* スカスカ感 */
    }

    .bottomGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .miniCard{
      background:#fff;
      border:1px solid var(--line);
      border-radius: var(--r);
      padding:10px;
    }
    .label{ font-size:12px; color:var(--muted); }
    .value{ margin-top:4px; font-size:18px; font-weight:800; }

    .msg{
      font-size:11px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    @media (max-height: 740px){
      button{ padding: 12px 12px; font-size:17px; border-radius:14px; }
      .calendarWrap{ padding:8px; }
      .calendar{ gap:5px; }
      .day{ border-radius:10px; font-size:11px; }
      .bottomGrid{ gap:8px; }
      .miniCard{ padding:8px; }
      .value{ font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 上部：ユーザー呼び出し -->
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h1>スクワット出席（20回）</h1>
        <span class="pill">状態：未記帳（ダミー）</span>
      </div>
      <div class="row" style="margin-top:10px;">
        <div class="grow">
          <div class="muted" style="margin:0 0 6px;">ユーザー呼び出し</div>
          <select>
            <option> ユーザー１ </option>
            <option> ちな雲丹 </option>
          </select>
        </div>
        <div style="width:92px;">
          <div class="muted" style="margin:0 0 6px;">更新</div>
          <button class="btnGhost" type="button">更新</button>
        </div>
      </div>
    </div>

    <!-- 真ん中：大ボタン -->
    <button class="btnPrimary" type="button">スクワットやったよボタン>ｓ

    <!-- 下部：カレンダー＋KPI -->
    <div class="card main">
      <div class="row" style="justify-content:space-between;">
        <div>
          <div class="muted">2025-12（ダミー）</div>
          <div class="value" style="font-size:16px;">今月の出席</div>
        </div>
        <div class="row" style="gap:6px; flex-wrap:wrap; justify-content:flex-end;">
          <span class="pill">自分：--回</span>
          <span class="pill">連続：--日</span>
          <span class="pill">今日：--</span>
        </div>
      </div>

      <div class="calendarWrap">
        <div class="calendar">
          <div class="dow">日</div><div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div>
          <!-- 形だけの42マス -->
          <!-- 1〜42 を薄く表示して “カレンダーっぽさ”だけ出します -->
          <div class="day">1</div><div class="day">2</div><div class="day">3</div><div class="day">4</div><div class="day">5</div><div class="day">6</div><div class="day">7</div>
          <div class="day">8</div><div class="day">9</div><div class="day">10</div><div class="day">11</div><div class="day">12</div><div class="day">13</div><div class="day">14</div>
          <div class="day">15</div><div class="day">16</div><div class="day">17</div><div class="day">18</div><div class="day">19</div><div class="day">20</div><div class="day">21</div>
          <div class="day">22</div><div class="day">23</div><div class="day">24</div><div class="day">25</div><div class="day">26</div><div class="day">27</div><div class="day">28</div>
          <div class="day">29</div><div class="day">30</div><div class="day">31</div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div>
          <div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div>
        </div>
      </div>

      <div class="bottomGrid">
        <div class="miniCard">
          <div class="label">ちな雲丹のデータ：今日の進捗</div>
          <div class="value">--</div>
          <div class="muted">--</div>
        </div>
        <div class="miniCard">
          <div class="label">全体の継続率</div>
          <div class="value">--</div>
          <div class="muted">--</div>
        </div>
      </div>

      <div class="msg">GitHub Pages用の形だけのindex.htmlです（JSなし）</div>
    </div>
  </div>
</body>
</html>
